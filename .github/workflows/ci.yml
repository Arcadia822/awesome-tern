name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: ci-${{ github.ref }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Validate list.yml
        run: uv run -q tools/awesome_tern.py check
      # On main (pushes, nightly, manual runs): fetch stars and status, rebuild, commit.
      - name: Refresh metadata and regenerate README.md
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run -q tools/awesome_tern.py refresh
          uv run -q tools/awesome_tern.py build
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update README.md and metadata"
          git push
